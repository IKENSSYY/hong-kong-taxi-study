<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b42"><title>香港的士筆試練習</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;background:#f4f6f9;color:#17283b;margin:0}header{background:#142b42;color:white;padding:22px}main{max-width:850px;margin:auto;padding:18px}button,select{font:inherit;padding:13px;border-radius:12px;border:1px solid #bdc8d4;background:white;cursor:pointer}button:focus{outline:3px solid #82b8ff}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#142b42;color:white}.panel{background:white;padding:22px;border-radius:18px;margin-top:18px;box-shadow:0 3px 15px #152d4210}.muted{color:#607080}.question{font-size:1.5rem;font-weight:700;margin:24px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.options button{text-align:left;min-height:64px}.correct{background:#d8f3e1!important}.wrong{background:#ffe2df!important}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{border:2px dashed #b9c7d8;border-radius:15px;min-height:190px;display:grid;place-items:center;text-align:center;padding:20px;margin:16px 0;cursor:pointer}.pill{display:inline-block;background:#eaf0f8;padding:6px 12px;border-radius:30px;margin:5px}.primary{background:#1964b0;color:white}.hidden{display:none}li{padding:7px 0}@media(max-width:560px){.options{grid-template-columns:1fr}.panel{padding:16px}.question{font-size:1.25rem}}</style></head><body><header><div style="max-width:850px;margin:auto"><h1>🚕 香港的士筆試練習</h1><div>地區學習 · 選擇題 · 記憶卡 · 錯題重溫</div></div></header><main><p class="muted">試用版本：以下只收錄已核對的示範題目，並非完整題庫。進度只儲存在目前瀏覽器。</p><nav class="tabs" id="tabs"><button data-tab="learn" class="active">地區學習</button><button data-tab="quiz">選擇題</button><button data-tab="cards">記憶卡</button><button data-tab="missed">錯題重溫</button></nav><section class="panel"><div class="row"><label>選擇地區： <select id="district"></select></label><span id="progress" class="muted"></span></div><div id="content"></div></section></main><script>
const data=[['香港科學館','尖沙咀'],['香港歷史博物館','尖沙咀'],['香港太空館','尖沙咀'],['香港文化中心','尖沙咀'],['海港城','尖沙咀'],['K11 MUSEA','尖沙咀'],['香港半島酒店','尖沙咀'],['香港喜來登酒店','尖沙咀'],['香港中文大學','沙田'],['香港迪士尼樂園','竹篙灣'],['仁安醫院','富健街'],['香港科技大學','清水灣'],['香港理工大學','紅磡'],['香港城市大學','九龍塘'],['香港浸會大學','九龍塘'],['香港大學本部大樓','般咸道'],['香港會議展覽中心','灣仔'],['香港文化博物館','沙田'],['香港中央圖書館','銅鑼灣'],['沙田第一城','沙田']].map(([name,place],id)=>({id,name,place}));
const places=[...new Set(data.map(x=>x.place))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));const district=document.querySelector('#district');district.innerHTML='<option value="all">全部地區</option>'+places.map(x=>`<option>${x}</option>`).join('');let tab='learn',current=0,reveal=false,answered=false;let stats={};try{stats=JSON.parse(localStorage.getItem('taxi-progress-v1')||'{}')}catch{};const content=document.querySelector('#content');const pool=()=>data.filter(x=>district.value==='all'||x.place===district.value);const shuffled=a=>[...a].sort(()=>Math.random()-.5);let queue=[];function start(){queue=shuffled(tab==='missed'?pool().filter(x=>stats[x.id]?.wrong):pool());current=0;reveal=false;answered=false;render()};function save(id,ok){let s=stats[id]||{right:0,wrong:0};s[ok?'right':'wrong']++;if(ok&&s.wrong)s.wrong=Math.max(0,s.wrong-1);stats[id]=s;localStorage.setItem('taxi-progress-v1',JSON.stringify(stats));renderProgress()};function renderProgress(){document.querySelector('#progress').textContent=`已練習 ${Object.keys(stats).length} / ${data.length} 題`};function next(){current++;reveal=false;answered=false;render()};function render(){renderProgress();if(tab==='learn'){let groups={};for(const x of pool())(groups[x.place]??=[]).push(x.name);content.innerHTML=Object.entries(groups).sort().map(([place,names])=>`<h2>${place} <small class="muted">(${names.length})</small></h2><ul>${names.map(n=>`<li>${n}</li>`).join('')}</ul>`).join('')||'此地區暫無題目';return}let x=queue[current];if(!x){content.innerHTML='<p>本輪已完成，或目前沒有需要重溫的錯題。</p><button class="primary" id="restart">重新開始</button>';document.querySelector('#restart').onclick=start;return}if(tab==='quiz'||tab==='missed'){let choices=shuffled([x.place,...shuffled(places.filter(p=>p!==x.place)).slice(0,3)]);content.innerHTML=`<p class="muted">第 ${current+1} / ${queue.length} 題</p><div class="question">${x.name} 位於哪裏？</div><div class="options">${choices.map(c=>`<button data-answer="${c}">${c}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button id="next" class="primary hidden">下一題</button>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let ok=b.dataset.answer===x.place;save(x.id,ok);document.querySelectorAll('[data-answer]').forEach(y=>{y.disabled=true;if(y.dataset.answer===x.place)y.classList.add('correct');else if(y===b)y.classList.add('wrong')});document.querySelector('#feedback').textContent=ok?'答對了！':`正確答案：${x.place}`;document.querySelector('#next').classList.remove('hidden')});document.querySelector('#next').onclick=next;return}content.innerHTML=`<p class="muted">第 ${current+1} / ${queue.length} 張</p><div class="card" id="card"><div><div class="muted">${reveal?'答案':'地點在哪裏？點擊翻卡'}</div><div class="question">${reveal?x.place:x.name}</div></div></div><div id="rating" class="${reveal?'':'hidden'}"><button id="no">不記得</button> <button id="yes" class="primary">記得</button></div>`;document.querySelector('#card').onclick=()=>{reveal=!reveal;render()};if(reveal){document.querySelector('#no').onclick=()=>{save(x.id,false);next()};document.querySelector('#yes').onclick=()=>{save(x.id,true);next()}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(z=>z.classList.toggle('active',z===b));if(tab==='learn')render();else start()});district.onchange=()=>tab==='learn'?render():start();render();
</script></body></html>
