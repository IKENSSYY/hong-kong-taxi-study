if(tab==='cards'){let card=el('button',undefined,'card');card.setAttribute('aria-label',revealed?'答案 '+x.place+'，點擊翻回題目':'題目 '+x.name+'，點擊顯示答案');add(card,el('span',revealed?'正確答案':'這個地方在哪裏？點擊翻卡','muted'),el('div',revealed?x.place:x.name,'question'));card.onclick=()=>{revealed=!revealed;render()};root.append(card);if(revealed){let actions=el('div',undefined,'actions'),no=el('button','✕ 不記得'),yes=el('button','✓ 記得','primary');no.onclick=()=>{save(x,false);next()};yes.onclick=()=>{save(x,true);next()};add(actions,no,yes);root.append(actions)}return}
add(root,el('div',`${x.name} 位於哪裏？`,'question'));let opts=el('div',undefined,'options'),feedback=el('div',undefined,'feedback');for(let c of choices){let b=el('button',c);b.onclick=()=>{if(answered)return;answered=true;let ok=c===x.place;save(x,ok);for(let child of opts.children){child.disabled=true;if(child.textContent===x.place)child.classList.add('correct');else if(child===b)child.classList.add('wrong')}feedback.className='feedback '+(ok?'ok':'bad');feedback.textContent=ok?'✓ 答對了！':`✕ 正確答案：${x.place}`;nextButton.classList.remove('hidden')};opts.append(b)}root.append(opts,feedback);let nextButton=el('button','下一題 →','primary hidden');nextButton.onclick=next;root.append(nextButton)
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(z=>z.setAttribute('aria-selected',String(z===b)));if(tab==='learn')render();else start()});$('#category').onchange=()=>{fillDistrict();if(tab==='learn')render();else start()};$('#district').onchange=render;$('#reshuffle').onclick=start;$('#reset').onclick=()=>{if(confirm('確定清除本裝置的所有練習紀錄？')){stats={};localStorage.removeItem(key);if(tab==='missed')start();else render()}};fillDistrict();render();
